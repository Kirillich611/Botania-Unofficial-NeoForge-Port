pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = "Fabric"
            url = uri("https://maven.fabricmc.net")
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases"
            content {
                includeGroup("net.neoforged")
            }
        }
    }
}

rootProject.name = "Botania"
includeBuild("build-logic")
include("Xplat")
// Fabric sources are retained; this working build targets NeoForge.
include("NeoForge")
